    # --- AI test topshiriqlari demosi (javi.uz/adliya/), qidiruv tizimlarida ko'rinmaydi ---
    location = /adliya { return 301 /adliya/; }
    location = /adliya/ { root /var/www/adliya-demo; try_files /index.html =404; add_header X-Robots-Tag "noindex, nofollow" always; add_header Cache-Control "no-cache"; }
    location ^~ /adliya/savol-javob/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=adliya_ask burst=20 nodelay;
        client_max_body_size 3m;
        proxy_read_timeout 90s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ /adliya/hujjat/ {
        proxy_pass http://127.0.0.1:8093/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=adliya_doc burst=10 nodelay;
        client_max_body_size 21m;
        proxy_read_timeout 180s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ /adliya/qalqon/ {
        proxy_pass http://127.0.0.1:8095/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=adliya_ask burst=20 nodelay;
        client_max_body_size 256k;
        proxy_read_timeout 30s;
        access_log off;                       # matn URL da emas, lekin shunday ham jurnal yozilmaydi
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ /adliya/trening/ {
        proxy_pass http://127.0.0.1:8097/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=adliya_ask burst=20 nodelay;
        client_max_body_size 16k;
        proxy_read_timeout 320s;                  # GPU uxlab turgan bo'lsa birinchi so'rov 1-2 daqiqa
        access_log off;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /adliya/taqdimot { return 301 /adliya/taqdimot/; }
    location = /adliya/taqdimot/ { root /var/www/adliya-demo; try_files /taqdimot.html =404; add_header X-Robots-Tag "noindex, nofollow" always; add_header Cache-Control "no-cache"; }
